# ============================================================================
# GENERAL OPTIONS
# ============================================================================

# Mouse support and terminal settings
set -g mouse on
set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm*:Tc"
set-option -g status-position top
set -g set-clipboard on
set -g detach-on-destroy off # Don't exit from tmux when closing a session

# Window and pane numbering
set -g base-index 1       # Start windows at 1, not 0
setw -g pane-base-index 1 # Start panes at 1, not 0
set-window-option -g pane-base-index 1
set-option -g renumber-windows on # Renumber windows when one is closed

# Window behavior
set-option -g allow-rename off # Don't rename windows automatically

# Enable Yazi Image Previewer
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# ============================================================================
# Window popups
# ============================================================================
# Popup session switcher / creator with fzf
# - shows list of sessions
# - Ctrl-K kills a session (and reloads list)
# - Enter on existing session → switch
# - Enter on query → create + switch
# - Preview pane shows windows inside the session
bind O display-popup -w 80% -h 70% -E "$HOME/.config/tmux/scripts/session-fzf.sh"

bind-key "T" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

bind -N "last-session (via sesh) " o run-shell "sesh last || tmux display-message 'No last session'"

# Key bindings help
bind k display-popup \
  -w 90% \
  -h 100% \
  -E "tmux list-keys | fzf"

# AI Assistant popup
# bind a display-popup -w 40% -h 80% -E "fish -c 'ask -i'"

# ============================================================================
# PREFIX KEY
# ============================================================================

unbind C-b
# set -g prefix M-`
set -g prefix C-g
# bind M-` send-prefix
bind C-b send-prefix

# ============================================================================
# KEY BINDINGS
# ============================================================================

# Configuration reload
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded ☺️"

# Theme menu — press t, then:
#   t  flip the light/dark theme
#   e  fix pane borders (clears a border color a tool like Claude set on a
#      single window, hiding your normal borders; a plain reload won't undo it)
unbind e
bind t switch-client -T theme
bind -T theme t run-shell 'out=$(zsh -ic "typeset -f zshrc_term_theme >/dev/null 2>&1 && zshrc_term_theme" 2>/dev/null | tail -n1); [ -n "$out" ] && tmux display-message "$out"'
bind -T theme e run-shell "$HOME/.config/tmux/scripts/fix-borders.sh"

# Clear screen and scrollback history
bind C-k send-keys -R \; clear-history \; send-keys Enter

# Unbind Ctrl+T to let it pass through to shell
unbind C-t

# Pane splitting (open in current directory)
bind '"' split-window -v -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '|' split-window -h -c "#{pane_current_path}"

# New window in same path (c: next to current, C: at end)
bind c new-window -ac "#{pane_current_path}"
bind C new-window -c "#{pane_current_path}"
bind-key S command-prompt -p "Session name:" "new-session -s '%%'"

# Window navigation
bind -n C-H previous-window
bind -n C-L next-window

# Switch to window 1-6 with Alt+1-6 (no prefix)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-S-Left previous-window
bind -n M-S-Right next-window

# Disable Alt/Option + Arrow keys for pane navigation (use Ctrl+hjkl via vim-tmux-navigator instead)
unbind -n M-Left
unbind -n M-Right
unbind -n M-Up
unbind -n M-Down

# Pane resizing with leader + HJKL
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r m resize-pane -Z # Use m key to maximize pane

# Pane resizing with leader + Arrow keys
bind -r Left resize-pane -L 5
bind -r Down resize-pane -D 5
bind -r Up resize-pane -U 5
bind -r Right resize-pane -R 5

# Window reordering
bind-key -n M-i swap-window -t -1\; select-window -t -1
bind-key -n M-o swap-window -t +1\; select-window -t +1

# ============================================================================
# VI MODE & COPY MODE
# ============================================================================

# Uncomment for "mocha"
# set-hook -g pane-mode-changed { if -F "#{pane_in_mode}" "selectp -P bg=#2a2a2e" "selectp -P default" }

set-window-option -g mode-keys vi
set -wg mode-style "bg=yellow,fg=black,bold"

# Vi-style copy mode keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
# Rectangle selection like Vim blockwise visual
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

bind-key -T copy-mode-vi y send-keys -X copy-selection "pbcopy"
bind-key -T copy-mode-vi Y send-keys -X copy-selection-and-cancel "pbcopy"

# AI Ask with selection - copy selection and open AI chat
# bind-key -T copy-mode-vi a send-keys -X copy-selection \; run-shell "$HOME/.config/tmux/scripts/ai-ask-selection.sh"

# Page Up/Down scrolling
bind -n PPage copy-mode \; send-keys -X halfpage-up
bind -T copy-mode-vi PPage send-keys -X halfpage-up
bind -T copy-mode-vi NPage send-keys -X halfpage-down

# Don't exit copy mode when dragging with mouse
unbind -T copy-mode-vi MouseDragEnd1Pane

# ============================================================================
# PLUGINS
# ============================================================================

# Plugin manager
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Functionality plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
# set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'schasse/tmux-jump'
set -g @plugin 'nhdaly/tmux-scroll-copy-mode'
set -g @scroll-speed-num-lines-per-scroll 5

# Commented out plugins (uncomment if needed)
# set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

# ============================================================================
# PLUGIN CONFIGURATION
# ============================================================================

# Enable tmux-resurrect to capture pane contents and tmux-continuum to automatically restore sessions
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Floating terminal (tmux-floax) — toggle with Alt-f. floax works natively on
# macOS; the WSL branch replaces this with a scratch-session popup instead.
set -g @floax-bind '-n M-f'
set -g @floax-width '50%'
set -g @floax-height '50%'
set -g @floax-border-color 'magenta'

# ============================================================================
# PANE BORDERS
# ============================================================================

set -g pane-border-lines single
# --- How the border colors get decided -------------------------------------
# Goal: the lines drawn around panes should look good whether the terminal is
# in its light look or its dark look. One fixed color can't do both, so the
# real color choice lives in my shell startup file (~/.zshrc), and tmux just
# asks it. Here's the chain:
#
#   1. The two `set` lines just below are the safety-net colors. They take
#      effect instantly and work on any machine, even one that knows nothing
#      about the light/dark trick.
#   2. The `run-shell` line right after asks a helper kept in ~/.zshrc, named
#      `zshrc_term_borders`, to repaint the lines to match whichever look
#      (light or dark) the terminal is currently using. That helper is the one
#      place that actually knows the light/dark colors.
#   3. If that helper isn't there — for example on my Mac, which has a
#      different ~/.zshrc — nothing breaks: the safety-net colors stay, and
#      the helper call silently does nothing (no error, no message).
#   4. Separately, when I switch the whole terminal between light and dark
#      (the `t` key up top, which runs `zshrc_term_theme`), that same helper
#      recolors these lines on the spot, so they always match.
#
# Short version: the colors below are the backup; ~/.zshrc has the final say.
set -g pane-border-style "fg=#7d9183,reverse"
set -g pane-active-border-style "fg=#7fa98c,reverse,bold"
run-shell -b "zsh -ic 'typeset -f zshrc_term_borders >/dev/null 2>&1 && zshrc_term_borders' 2>/dev/null || true"

# Show a name on each pane's top border: "<index>: <name>". The name is a custom
# title if you've set one (prefix + P), otherwise the running command. Text color
# follows the border style above, so it tracks the theme and dims for inactive panes.
set -g pane-border-status top
set -g pane-border-format " #P: #{?#{==:#{pane_title},#{host}},#{pane_current_command},#{pane_title}} "

# Rename the current pane (sets its title; clears back to command name if left empty)
bind P command-prompt -p "Pane name:" "select-pane -T '%%'"

# ============================================================================
# STATUS LINE CONFIGURATION
# ============================================================================

set -g status-style "fg=default,bg=default"
set -g status-left "[#S] "
set -g status-right "#{?client_prefix,#[reverse] PREFIX #[noreverse] ,}%Y-%m-%d %H:%M "
set -g window-status-current-style "reverse"

# Color the window tab red when one of its panes is zoomed
set -g window-status-format "#{?window_zoomed_flag,#[fg=red bold],}#I:#W#{?window_flags,#F, }"
set -g window-status-current-format "#{?window_zoomed_flag,#[fg=red bold],}#I:#W#{?window_flags,#F, }"

# ============================================================================
# INITIALIZE PLUGIN MANAGER
# ============================================================================

# Initialize TPM (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
