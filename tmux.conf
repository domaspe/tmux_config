# ============================================================================
# GENERAL OPTIONS
# ============================================================================

# Mouse support and terminal settings
set -g mouse on
set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm*:Tc"
# Node TUIs (Claude Code) read $COLORTERM for truecolor, not terminfo; tmux never
# forwards it, so without this 24-bit theme colors downsample to bright ANSI green.
set-environment -g COLORTERM truecolor
set-option -g status-position top
set -g set-clipboard on
set -g detach-on-destroy off # Don't exit from tmux when closing a session

# Window and pane numbering
set -g base-index 1       # Start windows at 1, not 0
setw -g pane-base-index 1 # Start panes at 1, not 0
set-window-option -g pane-base-index 1
set-option -g renumber-windows on # Renumber windows when one is closed

# Window behavior
set-option -g allow-rename off # Don't rename windows automatically

# Enable Yazi Image Previewer
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# ============================================================================
# Window popups
# ============================================================================
# O used to open scripts/session-fzf.sh, which never existed in this repo.
# Unbound explicitly: a reload does not drop a binding the config stopped
# defining, so a server that has been up since then would keep it.
unbind -q O

bind-key -N "session picker popup (sesh)" "T" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  M-a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'alt-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

bind -N "last-session (via sesh) " o run-shell "sesh last || tmux display-message 'No last session'"

# Key bindings help
bind k display-popup \
  -w 90% \
  -h 100% \
  -E "tmux list-keys | fzf"

# ============================================================================
# PREFIX KEY
# ============================================================================

unbind C-b
unbind C-g
set -g prefix C-a
# Press the prefix twice to send a literal Ctrl-a to the active program.
bind C-a send-prefix

# ============================================================================
# KEY BINDINGS
# ============================================================================

# Configuration reload
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded ☺️"

# Theme menu — press t, then:
#   e  fix pane borders (clears a border color a tool like Claude set on a
#      single window, hiding your normal borders; a plain reload won't undo it)
#   f  toggle the terminal font size: 12 laptop / 10 external
unbind e
# A reload does not drop a binding the config stopped defining, so a server that
# has been up since the theme toggle existed would keep it.
unbind -q -T theme t
bind t switch-client -T theme
bind -T theme e run-shell "$HOME/.config/tmux/scripts/fix-borders.sh"
bind -T theme f run-shell "$HOME/.config/tmux/scripts/font.sh toggle"

# Clear screen and scrollback history
bind C-k send-keys -R \; clear-history \; send-keys Enter

# Unbind Ctrl+T to let it pass through to shell
unbind C-t

# Pane splitting (open in current directory)
bind '"' split-window -v -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '|' split-window -h -c "#{pane_current_path}"

# New window in same path (c: next to current, C: at end)
bind c new-window -ac "#{pane_current_path}"
bind C new-window -c "#{pane_current_path}"
bind-key S command-prompt -p "Session name:" "new-session -s '%%'"

# Window keys without prefix. Alt, not Ctrl: a terminal cannot send Ctrl+<digit>
# as a key of its own, so tmux would never see it.

# Switch to window 1-6 with Alt+1-6
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6

# Alt+7/8 step through windows, Alt+9/0 move the current window
bind-key -n -N "previous window" M-7 previous-window
bind-key -n -N "next window"     M-8 next-window
bind-key -n -N "move current window left"  M-9 swap-window -t -1\; select-window -t -1
bind-key -n -N "move current window right" M-0 swap-window -t +1\; select-window -t +1

# Keys the bindings above replaced. A reload does not drop a binding a running
# server already has, so unbind them explicitly.
unbind -q -n M-H
unbind -q -n M-L
unbind -q -n M-S-Left
unbind -q -n M-S-Right
# Window reordering moved off M-i / M-o; both keys now reach Neovim, which has
# its own use for them.
unbind -q -n M-i
unbind -q -n M-o

# Disable Alt/Option + Arrow keys for pane navigation (use Ctrl+hjkl via vim-tmux-navigator instead)
unbind -n M-Left
unbind -n M-Right
unbind -n M-Up
unbind -n M-Down

# Pane resizing with leader + HJKL
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r m resize-pane -Z # Use m key to maximize pane

# Pane resizing with leader + Arrow keys
bind -r Left resize-pane -L 5
bind -r Down resize-pane -D 5
bind -r Up resize-pane -U 5
bind -r Right resize-pane -R 5

# List the current directory in the focused pane
bind -n M-l send-keys "ls -la" Enter

# ============================================================================
# VI MODE & COPY MODE
# ============================================================================

set-window-option -g mode-keys vi
set -wg mode-style "bg=yellow,fg=black,bold"

# Vi-style copy mode keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
# Rectangle selection like Vim blockwise visual
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

bind-key -T copy-mode-vi y send-keys -X copy-pipe-no-clear "clip.exe"
bind-key -T copy-mode-vi Y send-keys -X copy-pipe-and-cancel "clip.exe"

# Page Up/Down scrolling
# Pass Page Up through to full-screen apps (micro, vim, less); otherwise scroll back
bind -n PPage if-shell -F '#{alternate_on}' 'send-keys PPage' 'copy-mode -e ; send-keys -X halfpage-up'
bind -T copy-mode-vi PPage send-keys -X halfpage-up
bind -T copy-mode-vi NPage send-keys -X halfpage-down

bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "clip.exe"

# ============================================================================
# PLUGINS
# ============================================================================

# Plugin manager
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Functionality plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'schasse/tmux-jump'
set -g @plugin 'nhdaly/tmux-scroll-copy-mode'
set -g @scroll-speed-num-lines-per-scroll 5

set -g @plugin 'tmux-plugins/tmux-battery'

# ============================================================================
# PLUGIN CONFIGURATION
# ============================================================================

# Enable tmux-resurrect to capture pane contents and tmux-continuum to automatically restore sessions
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Floating terminal popup backed by a persistent "scratch" session, so closing
# the popup keeps the shell alive and M-f reopens it where you left off.
# Pressing M-f inside the popup detaches (closes) it. detach-on-destroy stays on
# for scratch so the popup closes instead of jumping to another session when its
# shell exits.
bind -n M-f if-shell -F "#{==:#{session_name},scratch}" {
    detach-client
} {
    display-popup -w 50% -h 50% -b rounded -S fg=magenta -E 'unset TMUX; tmux new-session -d -s scratch 2>/dev/null; tmux set-option -t scratch status off; tmux set-option -t scratch detach-on-destroy on; exec tmux attach-session -t scratch'
}

# ============================================================================
# PANE BORDERS
# ============================================================================

set -g pane-border-lines single
# Nothing notifies tmux when the Windows theme changes, so poll for it.
run-shell -b "$HOME/.config/tmux/scripts/theme.sh apply"
run-shell -b "pidfile=/tmp/tmux-theme-poller.pid; [ -f \"\$pidfile\" ] && kill \"\$(cat \"\$pidfile\")\" 2>/dev/null; $HOME/.config/tmux/scripts/theme-poller.sh"

# Show a name on each pane's top border: "<index>: <name>". The name is a custom
# title if you've set one (prefix + P), otherwise the running command. Text color
# follows the border style above, so it tracks the theme and dims for inactive panes.
set -g pane-border-status top
set -g pane-border-format " #P: #{?#{==:#{pane_title},#{host}},#{pane_current_command},#{pane_title}} "

# Rename the current pane (sets its title; clears back to command name if left empty)
bind P command-prompt -p "Pane name:" "select-pane -T '%%'"

# ============================================================================
# STATUS LINE CONFIGURATION
# ============================================================================

# The bar, its text and the current window's block are colored by
# scripts/theme.sh, which gives them a blue of their own rather than the pane
# border color, so the bar follows the Windows theme without matching the
# borders. Nothing is set here: a reload would overwrite what the script picked.
set -g status-left "[#S] "
set -g status-right "#{?client_prefix,#[reverse] PREFIX #[noreverse] ,}%Y-%m-%d %H:%M "

# Window list starts right after status-left. Set explicitly rather than left
# out: a reload does not undo a value a running server already has, so dropping
# the line would leave an old server on whatever it was set to before.
set -g status-justify left

# Underline the tab of a window with a zoomed pane. Only an attribute, no color
# change: the current window's block stays the one highlighted tab in the bar.
set -g window-status-format "#{?window_zoomed_flag,#[underscore],}#I:#W#{?window_flags,#F, }"
set -g window-status-current-format "#{?window_zoomed_flag,#[underscore],}#I:#W#{?window_flags,#F, }"

# ============================================================================
# INITIALIZE PLUGIN MANAGER
# ============================================================================

# Initialize TPM (keep this line after all @plugin declarations)
run '~/.config/tmux/plugins/tpm/tpm'

# Regenerates SHORTCUTS.md from the live key tables. Runs after TPM so the
# plugins' own bindings are already in place and land in the file.
run-shell -b "$HOME/.config/tmux/scripts/shortcuts.sh"
